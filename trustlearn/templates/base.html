<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLearn: {% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4FB; --ink:#1C1B2E; --mute:#5C5A72; --line:#DEDAF0; --card:#FFFFFF;
  --brand:#4338CA; --brand-ink:#241F5C; --brand-soft:#E8E5FB;
  --py:#0E7C66; --py-soft:#DDF1EB; --maths:#A6238B; --maths-soft:#F6DFF0; --phy:#C9630C; --phy-soft:#FBE6D2;
  --accent:var(--brand); --accent-soft:var(--brand-soft);
  --warn:#8A5A00; --warnbg:#FDF0D5; --bad:#A12626; --badbg:#FBE4E4; --good:#0E7C66; --goodbg:#DDF1EB;
}
body[data-subject="python"]{ --accent:var(--py); --accent-soft:var(--py-soft); }
body[data-subject="maths"]{ --accent:var(--maths); --accent-soft:var(--maths-soft); }
body[data-subject="physics"]{ --accent:var(--phy); --accent-soft:var(--phy-soft); }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 "Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:.2rem 0 .5rem;letter-spacing:-.01em}
h1{font-size:1.9rem}
h2{font-size:1.2rem}

header{background:var(--brand-ink);padding:.8rem 1.4rem;display:flex;gap:1.6rem;align-items:center;flex-wrap:wrap}
header b.word{font-family:"Fraunces",Georgia,serif;font-size:1.45rem;font-weight:700;color:#fff}
header nav{display:flex;gap:1.3rem}
header a{color:#C7C3EE;text-decoration:none;padding-bottom:4px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
header a:hover{color:#fff}
header a.on{color:#fff;border-bottom-color:#7DDCCB}
header a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7DDCCB;outline-offset:2px}
header .tagline{margin-left:auto;color:#9A95CE;font-size:.85rem}

main{max-width:960px;margin:1.6rem auto;padding:0 1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.3rem;margin-bottom:1.1rem;border-left:4px solid var(--line)}
.card.accented{border-left-color:var(--accent)}
.mute{color:var(--mute);font-size:.92rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.5rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
.table-wrap{overflow-x:auto}

.tag{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.8rem;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.good{background:var(--goodbg);color:var(--good)}

button{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:.5rem .95rem;font:600 .95rem "Inter",sans-serif;cursor:pointer;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button.alt{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
button:disabled{opacity:.55;cursor:not-allowed}
input[type=text],select,textarea{font:inherit;padding:.5rem .6rem;border:1.5px solid #C6C2E6;border-radius:7px;background:#fff}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

.flash{background:var(--warnbg);border:1px solid #e6c97a;padding:.6rem 1rem;border-radius:8px;margin-bottom:1.1rem}

.score{font-family:"Fraunces",Georgia,serif;font-size:2.7rem;font-weight:700;color:var(--accent);line-height:1}
.bar{height:9px;background:var(--line);border-radius:5px;margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:9px;background:var(--accent);border-radius:5px;transition:width .5s ease}

.subject-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem}
.subject-tabs a{text-decoration:none;padding:.5rem 1rem;border-radius:99px;font-weight:600;font-size:.92rem;border:1.5px solid var(--line);color:var(--mute);background:#fff}
.subject-tabs a.python.on{background:var(--py);border-color:var(--py);color:#fff}
.subject-tabs a.maths.on{background:var(--maths);border-color:var(--maths);color:#fff}
.subject-tabs a.physics.on{background:var(--phy);border-color:var(--phy);color:#fff}
.subject-tabs a:hover{border-color:var(--accent)}

.mini-scores{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.7rem}
.mini-score{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
.mini-score b{display:block;font-family:"Fraunces",serif;font-size:1.3rem}
.mini-score.python b{color:var(--py)} .mini-score.maths b{color:var(--maths)} .mini-score.physics b{color:var(--phy)}

@media (max-width:560px){ header{padding:.7rem 1rem} .tagline{display:none} .score{font-size:2.2rem} }
</style>
</head>
<body{% if request.endpoint == 'student' %} data-subject="{{ subject }}"{% endif %}>
<header>
<b class="word">TrustLearn</b>
<nav>
<a href="{{ url_for('student') }}" class="{{ 'on' if request.endpoint == 'student' }}">Student</a>
<a href="{{ url_for('faculty') }}" class="{{ 'on' if request.endpoint == 'faculty' }}">Faculty</a>
<a href="{{ url_for('admin') }}" class="{{ 'on' if request.endpoint == 'admin' }}">Ethics panel</a>
</nav>
<span class="tagline">Prototype with synthetic data</span>
</header>
<main>
{% for m in get_flashed_messages() %}<div class="flash" role="status">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
